<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="王者荣耀皮肤数据库将于2026年10月16日迁移至新网址。新站现已开放，欢迎提前访问并收藏。">
  <title>网站迁移公告 · 王者荣耀皮肤数据库</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <style>
    :root { color-scheme: dark; --bg:#10110f; --panel:#191b17; --text:#f1eee5; --muted:#aaa99e; --gold:#d9bd7a; --line:#34372e; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; line-height:1.7; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible { outline:3px solid var(--gold); outline-offset:5px; }
    .page { max-width:1120px; min-height:100svh; margin:auto; padding:36px 48px 24px; display:flex; flex-direction:column; }
    .brand { display:flex; align-items:center; gap:12px; font-size:15px; letter-spacing:.04em; }
    .brand img { width:30px; height:30px; }
    .brand span { color:var(--muted); font-size:11px; letter-spacing:.14em; display:block; }
    main { flex:1; display:grid; grid-template-columns:1.15fr 1fr; align-items:center; gap:64px; padding:80px 0; }
    .eyebrow { color:var(--gold); font-size:12px; letter-spacing:.16em; margin:0 0 26px; }
    h1 { font-size:clamp(38px,5vw,62px); line-height:1.25; font-weight:650; letter-spacing:-.04em; margin:0 0 24px; }
    h1 span { color:var(--gold); }
    .intro { color:var(--muted); font-size:16px; max-width:390px; margin:0; }
    .date { margin-top:36px; padding-top:24px; border-top:1px solid var(--line); display:flex; gap:24px; align-items:baseline; }
    .date-label { font-size:12px; color:var(--muted); }
    time { font-size:18px; letter-spacing:.04em; }
    .relative { margin-left:10px; font-size:12px; color:var(--gold); }
    .destination { background:var(--panel); border:1px solid var(--line); padding:32px; }
    .status { display:flex; align-items:center; gap:8px; font-size:12px; color:#b8c8a4; margin-bottom:30px; }
    .status::before { content:""; width:6px; height:6px; border-radius:50%; background:#b8c8a4; }
    .destination h2 { font-size:14px; font-weight:400; color:var(--muted); margin:0 0 8px; }
    .address { display:block; font-size:clamp(20px,2.3vw,27px); letter-spacing:-.04em; overflow-wrap:anywhere; margin-bottom:28px; }
    .primary { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:15px 18px; background:var(--gold); color:#181a14; font-size:15px; font-weight:600; transition:background .15s; }
    .primary:hover { background:#ead29a; }
    .primary span { font-size:22px; line-height:1; }
    .secondary { display:block; text-align:center; padding:17px 0 0; color:var(--muted); font-size:13px; }
    .secondary:hover { color:var(--text); }
    .note { font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:20px; margin:26px 0 0; }
    footer { display:flex; justify-content:space-between; align-items:baseline; gap:20px; border-top:1px solid var(--line); padding-top:22px; color:var(--muted); font-size:12px; }
    footer p { margin:0; }
    @media(max-width:760px) {
      .page { padding:24px; }
      main { grid-template-columns:1fr; gap:36px; padding:48px 0; }
      .eyebrow { margin-bottom:20px; }
      .intro { max-width:none; font-size:15px; }
      .date { margin-top:24px; }
      .destination { padding:26px; }
      .status { margin-bottom:22px; }
      footer { flex-direction:column; gap:7px; }
    }
    @media(prefers-reduced-motion:reduce) { .primary { transition:none; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand">
      <img src="/favicon.svg?v=2" alt="" width="30" height="30">
      <div>王者荣耀皮肤数据库<span>HONOR OF KINGS · SKIN DATABASE</span></div>
    </header>
    <main>
      <section aria-labelledby="notice-title">
        <p class="eyebrow">网站迁移公告 / 2026.10.15</p>
        <h1 id="notice-title">熟悉的皮肤图鉴，<br><span>即将有个新地址。</span></h1>
        <p class="intro" id="migration-description">网页版将于明天（10 月 16 日）迁移至新网址。皮肤资料与返场历史继续保留，欢迎提前访问并收藏新地址。</p>
        <div class="date">
          <span class="date-label">迁移日期 · 北京时间</span>
          <div><time datetime="2026-10-16">2026.10.16</time><span class="relative" id="relative-date">明天</span></div>
        </div>
      </section>
      <section class="destination" aria-labelledby="destination-title">
        <div class="status">新站现已开放</div>
        <h2 id="destination-title">请收藏新的访问地址</h2>
        <a class="address" href="https://youtiao.fun/hokskins/">youtiao.fun/hokskins/</a>
        <a class="primary" href="https://youtiao.fun/hokskins/">访问新站<span aria-hidden="true">↗</span></a>
        <a class="secondary" href="/legacy">继续访问旧版 →</a>
        <p class="note">部分图片仍在恢复中。旧版浏览器中的本地收藏暂不自动同步到新站，可通过旧版入口查看。</p>
      </section>
    </main>
    <footer>
      <p>本次公告仅针对网页版，小程序入口保持不变。</p>
      <p>王者荣耀皮肤数据库</p>
    </footer>
  </div>
  <script>
    // 按北京时间更新相对日期，避免公告过期后仍显示“明天”。
    const today = new Intl.DateTimeFormat('sv-SE', { timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
    if (today !== '2026-10-15') {
      document.getElementById('relative-date').textContent = today === '2026-10-16' ? '今天' : '';
      document.getElementById('migration-description').textContent = '网页版迁移日期为 2026 年 10 月 16 日。皮肤资料与返场历史继续保留，欢迎访问并收藏新地址。';
    }
  </script>
</body>
</html>
