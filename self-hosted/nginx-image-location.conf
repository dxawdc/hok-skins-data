location ^~ /hokskins/img/ {
    root /opt/hokskins/storage/public;
    try_files /$hokskins_image_variant$uri /originals$uri =404;
    limit_except GET HEAD { deny all; }
    limit_conn hokskins_images_per_ip 64;
    limit_conn hokskins_images_total 256;
    limit_conn_status 429;
    expires $hokskins_image_expiry;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Hokskins-Storage local always;
    access_log off;
}
