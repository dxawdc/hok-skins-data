# Used only by /hokskins/img/; keep image concurrency separate from API limits.
limit_conn_zone $binary_remote_addr zone=hokskins_images_per_ip:1m;
limit_conn_zone $server_name zone=hokskins_images_total:1m;
map $arg_width $hokskins_image_variant {
    default originals;
    60 thumbs/60;
    80 thumbs/80;
    120 thumbs/120;
    160 thumbs/160;
    200 thumbs/200;
    240 thumbs/320;
    320 thumbs/320;
}
# Unversioned historical links keep their short lifetime.
map $arg_v $hokskins_image_expiry {
    default 1h;
    "~^[0-9]{10,16}$" 30d;
}
